<aside class="app-sidebar">
  <div class="sidebar-header flex items-center justify-between">
    <div class="flex items-center gap-2 font-semibold">
      <i data-lucide="line-chart" style="width: 20px; height: 20px; color: var(--foreground);"></i>
      <span>좋문투기 일기장</span>
    </div>
    <!-- Theme Toggle Badge (삼순동순) -->
    <button type="button" @click="$store.app?.toggleTheme()"
      class="ui-badge badge-neutral cursor-pointer hover:border-[var(--ring)] transition-all flex items-center gap-1 text-[0.55rem] !py-1 !px-2 select-none"
      title="Click to toggle Light / Dark theme">
      <i :data-lucide="$store.app?.isDark ? 'moon' : 'sun'" class="w-3 h-3"></i>
      <span>Theme</span>
    </button>
  </div>

  <div class="sidebar-content">
    <div class="sidebar-label">Diary</div>

    <a href="/" class="sidebar-menu-btn {% if active_menu == 'dashboard' %}active{% endif %}" @click="$store.app?.closeSidebarOnMobile()">
      <i data-lucide="layout-dashboard" style="width: 16px; height: 16px;"></i>
      <span>Dashboard 현황</span>
    </a>

    <a href="/assets" class="sidebar-menu-btn {% if active_menu == 'assets' %}active{% endif %}" @click="$store.app?.closeSidebarOnMobile()">
      <i data-lucide="layers" style="width: 16px; height: 16px;"></i>
      <span>Assets 종목</span>
    </a>

    <a href="/plans" class="sidebar-menu-btn {% if active_menu == 'plans' %}active{% endif %}" @click="$store.app?.closeSidebarOnMobile()">
      <i data-lucide="target" style="width: 16px; height: 16px;"></i>
      <span>Plans 계획</span>
    </a>

    <a href="/trades" class="sidebar-menu-btn {% if active_menu == 'trades' %}active{% endif %}" @click="$store.app?.closeSidebarOnMobile()">
      <i data-lucide="receipt" style="width: 16px; height: 16px;"></i>
      <span>Trades 실행</span>
    </a>

    <a href="/reviews" class="sidebar-menu-btn {% if active_menu == 'reviews' %}active{% endif %}" @click="$store.app?.closeSidebarOnMobile()">
      <i data-lucide="pie-chart" style="width: 16px; height: 16px;"></i>
      <span>Reviews 복기</span>
    </a>

    <div class="sidebar-label mt-2">Help & News</div>
    <a href="/glossary" class="sidebar-menu-btn {% if active_menu == 'glossary' %}active{% endif %}" @click="$store.app?.closeSidebarOnMobile()">
      <i data-lucide="book-open" style="width: 16px; height: 16px;"></i>
      <span>Glossary 용어</span>
    </a>
    <a href="/widget" class="sidebar-menu-btn {% if active_menu == 'widget' %}active{% endif %}" @click="$store.app?.closeSidebarOnMobile()">
      <i data-lucide="layout-grid" style="width: 16px; height: 16px;"></i>
      <span>Widgets 위젯</span>
    </a>
  </div>

  <!-- Sidebar Footer: Shadcn NavUser Card with Dropdown -->
  <div class="sidebar-footer">
    <div class="relative" @click.away="if ($store.app) $store.app.userMenuOpen = false">
      <button type="button" @click="if ($store.app) $store.app.userMenuOpen = !$store.app.userMenuOpen"
        class="nav-user-btn" :class="{ '!bg-[var(--secondary)]': $store.app?.userMenuOpen }">
        <div class="nav-user-avatar">
          DU
        </div>
        <div class="flex-1 min-w-0">
          <div class="text-xs font-semibold text-[var(--foreground)] truncate">default_user</div>
          <div class="text-[0.7rem] text-[var(--muted-foreground)] truncate">삼순동순 Trader</div>
        </div>
        <i data-lucide="chevrons-up-down" class="w-3.5 h-3.5 text-[var(--muted-foreground)] flex-shrink-0"></i>
      </button>

      <!-- NavUser Popup Dropdown Menu (Upward) -->
      <div x-show="$store.app?.userMenuOpen" x-transition:enter="transition ease-out duration-150"
        x-transition:enter-start="transform opacity-0 -translate-y-1 scale-95"
        x-transition:enter-end="transform opacity-100 translate-y-0 scale-100" class="user-popup-menu"
        style="display: none;">
        <div class="px-2.5 py-1.5 border-b border-[var(--border)] text-[0.7rem] text-[var(--muted-foreground)]">
          Signed in as <strong class="text-[var(--foreground)] block truncate">default_user</strong>
        </div>
        <button type="button" class="action-item w-full flex items-center gap-2 mt-1"
          @click="alert('Account Settings (Multi-tenancy planned)'); if ($store.app) $store.app.userMenuOpen = false">
          <i data-lucide="user" class="w-3.5 h-3.5"></i>
          <span>Account Settings</span>
        </button>
        <button type="button" class="action-item danger w-full flex items-center gap-2"
          @click="alert('Logout functionality (Multi-tenancy planned)'); if ($store.app) $store.app.userMenuOpen = false">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          <span>Log out</span>
        </button>
      </div>
    </div>
  </div>
</aside>
