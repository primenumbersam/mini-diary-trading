{% extends "base.html" %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center;">
  <div>
    <h2 style="font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em;">Asset Universe</h2>
    <p style="font-size: 0.8125rem; color: var(--muted-foreground); margin-top: 2px;">
      Manage cash denominations, tradable assets, and real-time market price caches.
    </p>
  </div>
</div>

<script id="assets-data" type="application/json">
  {{ assets | tojson | safe }}
</script>

<div class="flex flex-col gap-6" x-data="assetsGrid(JSON.parse(document.getElementById('assets-data').textContent || '[]'))" x-init="init()">
  <!-- Top: Register New Asset Form Card -->
  <div class="ui-card w-full">
    <div class="ui-card-header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <i data-lucide="plus-circle" style="width: 16px; height: 16px; color: var(--muted-foreground);"></i>
        <span class="ui-card-title">Register Asset</span>
      </div>
    </div>
    <div class="ui-card-content">
      <form action="/api/assets" method="POST" class="flex flex-col gap-3">
        <!-- 1행: 4열 (Symbol, Name, Class, Country) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
          <div class="ui-form-group !mb-0">
            <label class="ui-label">Asset Symbol / ID</label>
            <input type="text" name="asset_id" class="ui-input" x-model="newSymbol" placeholder="e.g. AAPL, TSLA" required>
          </div>
          <div class="ui-form-group !mb-0">
            <label class="ui-label">Asset Name</label>
            <input type="text" name="asset_name" class="ui-input" x-model="newName" placeholder="e.g. Apple Inc." required>
          </div>
          <div class="ui-form-group !mb-0">
            <label class="ui-label">Asset Class</label>
            <select name="asset_class" class="ui-select" x-model="newClass">
              <option value="cash">Cash</option>
              <option value="stock">Stock</option>
              <option value="derivative">Derivative</option>
              <option value="bond">Bond</option>
            </select>
          </div>
          <div class="ui-form-group !mb-0">
            <label class="ui-label">Country / Exchange</label>
            <input type="text" name="asset_country" class="ui-input" x-model="newCountry" placeholder="e.g. US, KR, Binance" required>
          </div>
        </div>

        <!-- 2행: 비대칭 2열 (Description, Button) -->
        <div class="flex flex-col sm:flex-row items-end gap-3">
          <div class="ui-form-group !mb-0 flex-1 w-full">
            <label class="ui-label">Description / Note</label>
            <input type="text" name="asset_description" class="ui-input" x-model="newDesc" placeholder="Brief note...">
          </div>
          <button type="submit" class="ui-btn ui-btn-primary whitespace-nowrap h-9 px-6 sm:w-auto w-full">
            <i data-lucide="plus" class="w-4 h-4 mr-1.5"></i> Register Asset
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bottom: Asset Grid Table -->
  <div class="ui-card">
    <!-- Top Filter Bar: [Group, Class, Country, Status, Search, Columns] -->
    <div class="p-3 bg-[#262626] border-b border-[#38383a] flex flex-wrap items-center justify-between gap-3">
      <div class="flex flex-wrap items-center gap-2">
        <!-- 1. Group Filter (First) -->
        <select x-model="groupBy" class="ui-select !h-8 !text-xs !w-32 font-medium">
          <option value="none">Group: None</option>
          <option value="asset_class">Group: Class</option>
          <option value="asset_country">Group: Country</option>
          <option value="asset_status">Group: Status</option>
        </select>

        <!-- 2. Class Filter -->
        <select x-model="filterClass" class="ui-select !h-8 !text-xs !w-28">
          <option value="all">Class: All</option>
          <option value="cash">Cash</option>
          <option value="stock">Stock</option>
          <option value="derivative">Derivative</option>
          <option value="bond">Bond</option>
        </select>

        <!-- 3. Country Filter -->
        <select x-model="filterCountry" class="ui-select !h-8 !text-xs !w-28">
          <option value="all">Country: All</option>
          <template x-for="c in availableCountries" :key="c">
            <option :value="c" x-text="c"></option>
          </template>
        </select>

        <!-- 4. Status Filter -->
        <select x-model="filterStatus" class="ui-select !h-8 !text-xs !w-28">
          <option value="all">Status: All</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
          <option value="pending">Pending</option>
        </select>
      </div>

      <!-- Columns Customizer Dropdown -->
      <div class="relative">
        <button class="ui-btn ui-btn-sm" @click="showColMenu = !showColMenu">
          <i data-lucide="sliders-horizontal" class="w-3 h-3 mr-1"></i> Columns
        </button>
        <div x-show="showColMenu" @click.away="showColMenu = false" class="action-menu !w-40 p-2 shadow-2xl">
          <div class="text-[0.65rem] font-semibold text-[#a1a1aa] uppercase mb-1.5 px-1">Toggle Columns</div>
          <div class="flex flex-col gap-1">
            <label
              class="flex items-center gap-1.5 text-xs text-[#f4f4f5] p-1 hover:bg-[#2e2e32] rounded cursor-pointer">
              <input type="checkbox" x-model="cols.symbol"> Symbol
            </label>
            <label
              class="flex items-center gap-1.5 text-xs text-[#f4f4f5] p-1 hover:bg-[#2e2e32] rounded cursor-pointer">
              <input type="checkbox" x-model="cols.name"> Name
            </label>
            <label
              class="flex items-center gap-1.5 text-xs text-[#f4f4f5] p-1 hover:bg-[#2e2e32] rounded cursor-pointer">
              <input type="checkbox" x-model="cols.price"> Price
            </label>
            <label
              class="flex items-center gap-1.5 text-xs text-[#f4f4f5] p-1 hover:bg-[#2e2e32] rounded cursor-pointer">
              <input type="checkbox" x-model="cols.country"> Country
            </label>
            <label
              class="flex items-center gap-1.5 text-xs text-[#f4f4f5] p-1 hover:bg-[#2e2e32] rounded cursor-pointer">
              <input type="checkbox" x-model="cols.class"> Class
            </label>
            <label
              class="flex items-center gap-1.5 text-xs text-[#f4f4f5] p-1 hover:bg-[#2e2e32] rounded cursor-pointer">
              <input type="checkbox" x-model="cols.status"> Status
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- Table: [Symbol, Name, Current Price, Country, Class, Status, Action] -->
    <div class="ui-card-content" style="padding: 0;">
      <div class="table-wrap flex-1 flex flex-col min-h-0" style="border: none;">
        <table class="ui-table">
          <thead>
            <tr>
              <th x-show="cols.symbol" class="sortable" @click="sortBy('asset_id')">
                <div class="flex items-center gap-1">Symbol <i data-lucide="arrow-up-down" class="w-2.5 h-2.5"></i>
                </div>
              </th>
              <th x-show="cols.name" class="sortable" @click="sortBy('asset_name')">
                <div class="flex items-center gap-1">Name <i data-lucide="arrow-up-down" class="w-2.5 h-2.5"></i></div>
              </th>
              <th x-show="cols.price" class="sortable" @click="sortBy('current_price')">
                <div class="flex items-center gap-1">Current Price <i data-lucide="arrow-up-down"
                    class="w-2.5 h-2.5"></i></div>
              </th>
              <th x-show="cols.country" class="sortable" @click="sortBy('asset_country')">
                <div class="flex items-center gap-1">Country <i data-lucide="arrow-up-down" class="w-2.5 h-2.5"></i>
                </div>
              </th>
              <th x-show="cols.class" class="sortable" @click="sortBy('asset_class')">
                <div class="flex items-center gap-1">Class <i data-lucide="arrow-up-down" class="w-2.5 h-2.5"></i></div>
              </th>
              <th x-show="cols.status" class="sortable" @click="sortBy('asset_status')">
                <div class="flex items-center gap-1">Status <i data-lucide="arrow-up-down" class="w-2.5 h-2.5"></i>
                </div>
              </th>
              <th x-show="cols.actions" style="text-align: right; width: 60px;">Edit</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="row in displayRows" :key="row._rowKey">
              <tr :class="row._rowType === 'group' ? 'group-header-row' : ''"
                :id="row._rowType === 'data' ? 'asset-row-' + row.data.asset_id : null">
                <!-- Group Divider: single colspan cell -->
                <td x-show="row._rowType === 'group'" colspan="7"
                  class="!bg-[#1e1e22] !text-[#a1a1aa] font-semibold text-xs py-1.5 px-3 uppercase tracking-wider">
                  <span x-text="row.label"></span>
                </td>

                <!-- Data Row Cells -->
                <td x-show="row._rowType === 'data' && cols.symbol"><strong class="text-[#3b82f6]"
                    x-text="row.data?.asset_id"></strong></td>
                <td x-show="row._rowType === 'data' && cols.name" x-text="row.data?.asset_name"></td>
                <td x-show="row._rowType === 'data' && cols.price"
                  x-text="(row.data?.current_price) ? '$' + Number(row.data.current_price).toFixed(2) : '-'"></td>
                <td x-show="row._rowType === 'data' && cols.country" x-text="row.data?.asset_country"></td>
                <td x-show="row._rowType === 'data' && cols.class"><span class="ui-badge badge-neutral"
                    x-text="row.data?.asset_class"></span></td>
                <td x-show="row._rowType === 'data' && cols.status"><span class="ui-badge"
                    :class="'badge-' + (row.data?.asset_status || '')" x-text="row.data?.asset_status"></span></td>
                <td x-show="row._rowType === 'data' && cols.actions" style="text-align: right;">
                  <div class="action-dropdown" @click.away="if (openMenuId === row.data?.asset_id) openMenuId = null">
                    <button class="ui-btn ui-btn-sm !px-1.5"
                      @click="openMenuId = (openMenuId === row.data?.asset_id ? null : row.data?.asset_id)">
                      <i data-lucide="more-horizontal" class="w-3.5 h-3.5"></i>
                    </button>
                    <div x-show="openMenuId === row.data?.asset_id" class="action-menu shadow-2xl">
                      <button class="action-item" @click="openEdit(row.data)">
                        <i data-lucide="edit-3" class="w-3 h-3"></i> Edit
                      </button>
                      <button class="action-item"
                        @click="duplicateAsset(row.data.asset_id, row.data.asset_name, row.data.asset_class, row.data.asset_country, row.data.asset_description)">
                        <i data-lucide="copy" class="w-3 h-3"></i> Duplicate
                      </button>
                      <button class="action-item danger" :hx-delete="'/api/assets/' + row.data?.asset_id"
                        :hx-target="'#asset-row-' + row.data?.asset_id" hx-swap="outerHTML"
                        :hx-confirm="'Delete asset ' + row.data?.asset_id + '?'">
                        <i data-lucide="trash-2" class="w-3 h-3"></i> Delete
                      </button>
                    </div>
                  </div>
                </td>
              </tr>
            </template>

            <!-- Empty State -->
            <template x-if="processedItems.length === 0">
              <tr>
                <td colspan="7" class="text-center text-[#a1a1aa] py-8">No assets match the selected filters.</td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Edit Asset Modal -->
  <div x-show="showEditModal" class="modal-backdrop" style="display: none;">
    <div class="modal-content" @click.away="closeEdit()">
      <div class="p-4 bg-[#262626] border-b border-[#38383a] flex items-center justify-between">
        <h3 class="text-sm font-semibold text-[#f4f4f5] flex items-center gap-2">
          <i data-lucide="edit-3" class="w-4 h-4 text-[#3b82f6]"></i>
          Edit Asset: <span class="font-mono text-xs text-[#a1a1aa]" x-text="editItem.asset_id"></span>
        </h3>
        <button class="text-[#a1a1aa] hover:text-[#f4f4f5]" @click="closeEdit()">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form action="/api/assets/update" method="POST" class="p-4 flex flex-col gap-3">
        <input type="hidden" name="asset_id" :value="editItem.asset_id">

        <div class="ui-form-group !mb-0">
          <label class="ui-label">Asset Name</label>
          <input type="text" name="asset_name" class="ui-input" x-model="editItem.asset_name" required>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="ui-form-group !mb-0">
            <label class="ui-label">Asset Class</label>
            <select name="asset_class" class="ui-select" x-model="editItem.asset_class">
              <option value="stock">Stock</option>
              <option value="cash">Cash</option>
              <option value="derivative">Derivative</option>
              <option value="bond">Bond</option>
            </select>
          </div>
          <div class="ui-form-group !mb-0">
            <label class="ui-label">Country</label>
            <input type="text" name="asset_country" class="ui-input" x-model="editItem.asset_country" required>
          </div>
        </div>

        <div class="ui-form-group !mb-0">
          <label class="ui-label">Description</label>
          <input type="text" name="asset_description" class="ui-input" x-model="editItem.asset_description">
        </div>

        <div class="flex justify-end gap-2 mt-2">
          <button type="button" class="ui-btn ui-btn-sm" @click="closeEdit()">Cancel</button>
          <button type="submit" class="ui-btn ui-btn-primary ui-btn-sm">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
